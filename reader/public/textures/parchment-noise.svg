<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <filter id="parchment-noise" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.55 0.75"
      numOctaves="4"
      seed="3"
      stitchTiles="stitch"
      result="noise"
    />
    <feColorMatrix
      type="saturate"
      values="0"
      in="noise"
      result="gray-noise"
    />
    <feComponentTransfer in="gray-noise" result="brightened">
      <feFuncR type="linear" slope="0.08" intercept="0.92"/>
      <feFuncG type="linear" slope="0.06" intercept="0.90"/>
      <feFuncB type="linear" slope="0.04" intercept="0.84"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="brightened" mode="multiply" result="blended"/>
  </filter>
  <rect width="512" height="512" fill="#f5ede0" filter="url(#parchment-noise)" opacity="1"/>
</svg>
